name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: pytest (Python ${{ matrix.python-version }}, ${{ matrix.os }}, fallback RAG)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.12"]
    defaults:
      run:
        working-directory: pharma_intake_tracker
    env:
      # CI does not download the ~270 MB of local models; the deterministic fallback is used and
      # tests marked `models` are skipped. Run `pytest` locally with the models for full coverage.
      PHARMA_RAG_MODE: fallback
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pharma_intake_tracker/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run test suite
        run: python -m pytest
      - name: Regenerate demo evidence (smoke)
        run: python scripts/demo_run.py --mode fallback --out ${{ runner.temp }}/DEMO_OUTPUT.md
